<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAGAZINE - NEURONEST</title>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">

    <style>

        body {
            margin: 0;
            background: linear-gradient(
                        to bottom,
                        white 0%,
                        white 7%,
                        rgba(234, 216, 204, 0.5) 15%,
                        rgba(234, 216, 204, 0.5) 85%,
                        white 93%,
                        white 100%
                    );
        }

        .header {
            background-color: white;
            height: 100px;
            padding-top: 1px;
        }

        .heading {
            color: #3c2218;
            font-family: Bebas Neue;
            margin-left: 150px;
            margin-top: 30px;
        }

        .logo {
            position: absolute;
            top: 10px;
            left: 20px;
            height: 75px;
        }

        .mag {
            position: absolute;
            top: 30px;
            right: 510px;
            font-weight: bold;
            font-size: large;
            color: black;
            font-family: dm sans, sans-serif;
        }

        .eve {
            position: absolute;
            top: 30px;
            right: 400px;
            font-weight: bold;
            font-size: large;
            color: black;
            font-family: dm sans, sans-serif;
        }

        .gal {
            position: absolute;
            top: 30px;
            right: 280px;
            font-weight: bold;
            font-size: large;
            color: black;
            font-family: dm sans, sans-serif;
        }

        .more {
            position: absolute;
            top: 30px;
            right: 75px;
            font-weight: bold;
            font-size: large;
            color: black;
            font-family: dm sans, sans-serif;
        }

        .container,
        .container2 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin: 40px 30px;
            align-items: start;
        }

        .container a,
        .container2 a {
            display: block;
            overflow: hidden;
        }

        .container img,
        .container2 img {
            display: block;
            width: 100%;
            height: 350px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .container img:hover,
        .container2 img:hover {
            transform: scale(1.03);
        }

        .brainhead {
            font-family: 'Bebas Neue', sans-serif;
            text-align: center;
            font-size: 50px;
            margin: 35px 15px;
        }

        


        .footer {
            background-color: white;
            color: black;
            text-align: center;
            padding: 40px 20px;
            
        }

        .footer h2 {
            margin: 0 0 10px 0;
            font-family: 'Bebas Neue', sans-serif;
            font-size: xx-large;
        }

        .footer p {
            margin: 10px 0;
            font-size: large;
        }

        .mobile-header {
            display: none;
        }
        

        @media (max-width: 768px) {

            .header {
                display: none;
            }

            .mobile-header {
                height: 70px;
                padding: 0 15px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                background-color: white;
                box-sizing: border-box;
            }

            .mobile-header > a {
                display: block;
                flex-shrink: 0;
            }

            .mobile-header img {
                height: 50px;
                width: auto;
                display: block;
            }

            .mobile-header h1 {
                margin: 0;
                padding: 0;
                font-family: 'Bebas Neue', sans-serif;
                font-size: 28px;
                color: #3c2218;
                text-align: center;
                flex: 1;
            }

            .mobile-dropdown {
                position: relative;
                flex-shrink: 0;
            }

            .mobile-dropdown button {
                background: none;
                border: none;
                padding: 5px;
                font-family: 'DM Sans', sans-serif;
                font-weight: bold;
                font-size: 16px;
                color: black;
                cursor: pointer;
            }

            .mobile-dropdown-content {
                display: none;
                position: absolute;
                right: 0;
                top: 35px;
                width: 170px;
                background-color: white;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
                z-index: 100;
            }

            .mobile-dropdown-content a {
                display: block;
                padding: 12px 15px;
                text-decoration: none;
                color: black;
                font-family: 'DM Sans', sans-serif;
                font-weight: bold;
                font-size: 14px;
            }

            .mobile-dropdown-content a:hover {
                background-color: #f2f2f2;
            }

            .mobile-dropdown:hover .mobile-dropdown-content {
                display: block;
            }

            /* Mobile gallery */
            .brainhead {
                font-size: 32px;
                line-height: 1.2;
                margin: 30px 15px 20px;
            }

            .container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
                margin: 20px 12px;
            }

            .container img {
                height: 180px;
            }

            /* Center the fourth photo */
            .container2 {
                display: flex;
                justify-content: center;
                margin: 20px 12px 35px;
            }

            .container2 a {
                width: 70%;
                max-width: 350px;
            }

            .container2 img {
                height: 220px;
                width: 100%;
                object-fit: cover;
            }

            /* Prevent horizontal scrolling */
            body {
                overflow-x: hidden;
            }

            
        

            .footer {
                padding: 30px 15px;
            }

            .footer h2 {
                font-size: 30px;
            }

            .footer p {
                font-size: 15px;
            }
        }
    </style>
</head>
